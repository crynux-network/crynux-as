---
environment: "debug"
db:
  driver: "mysql"
  connection: "user:mypass@(127.0.0.1:3306)/crynux_as?parseTime=true&collation=utf8mb4_unicode_ci"
  log:
    level: "info"
    output: "data/logs/db.log"
    max_file_size: 100
    max_days: 30
    max_file_num: 5
log:
  level: "debug"
  output: "data/logs/crynux_as.log"
  max_file_size: 100
  max_days: 30
  max_file_num: 5
http:
  host: "0.0.0.0"
  port: "8090"
  max_body_bytes: 33554432
  jwt:
    secret_key_file: "config/secrets/jwt_secret_key.txt"
    expires_in: 604800
blockchains:
  ethereum:
    chain_id: 1
    rpc_endpoint: ""
    rps: 20
    start_block_num: 0
    log_block_range: 1000
    scan_interval: 5
    confirmation_blocks: 12
    receiving_address: "0x0000000000000000000000000000000000000001"
    tokens:
      usdt:
        address: "0xdAC17F958D2ee523a2206206994597C13D831ec7"
        decimals: 6
        credits_per_token: 1
      usdc:
        address: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
        decimals: 6
        credits_per_token: 1
  base:
    chain_id: 8453
    rpc_endpoint: ""
    rps: 20
    start_block_num: 0
    log_block_range: 1000
    scan_interval: 5
    confirmation_blocks: 12
    receiving_address: "0x0000000000000000000000000000000000000001"
    tokens:
      usdc:
        address: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
        decimals: 6
        credits_per_token: 1
bridge:
  base_url: ""
  api_key_file: "config/secrets/bridge_api_key.txt"
relay:
  base_url: ""
huggingface:
  api_base_url: "https://huggingface.co"
  timeout_seconds: 5
  cache_ttl_seconds: 300
llm:
  default_max_tokens: 2048
  default_vram_limit: 24
  loaded_models_refresh_interval: 1800
  queued_priority_refresh_interval: 300
  execution_time_cache_ttl: 300
  min_catalog_on_disk_node_count: 3
  base_vram: 8
  empty_queue_median_priority_gwei: "34"
  min_priority_gwei: "1"
  max_priority_gwei: "1000000000"
  credits_per_gwei: "1"
  default_auto_max_credits_per_task: "100"
  max_task_price_cnx:
    crynux: "0.001"
    openai: "0.001"
    anthropic: "0.001"
    google: "0.001"
  min_task_price_cnx:
    crynux: "0"
    providers: "0"
  job_submit_timeout: 600
  job_retention_days: 30
  task_result_dir: "data/task_results"
  project_recent_requests_limit: 50
usage_stats:
  recent_failure_window_seconds: 3600
  recent_failure_rate_threshold: "0.2"
credits:
  signup_bonus: 1000
  referral:
    deposit_reward_ratio: "0.10"
    invitee_bonus: 500
    purchase_bonus_tiers:
      - min_purchases: 50
        extra_ratio: "0.05"
      - min_purchases: 200
        extra_ratio: "0.10"
task_schema:
  stable_diffusion_inference: "https://raw.githubusercontent.com/crynux-network/stable-diffusion-task/refs/tags/v3.7.1/schema/image-task.json"
  gpt_inference: "https://raw.githubusercontent.com/crynux-network/gpt-task/refs/tags/v3.7.0/schema/gpt-inference-task.json"
  stable_diffusion_finetune_lora: "https://raw.githubusercontent.com/crynux-network/stable-diffusion-task/refs/tags/v3.7.1/schema/stable-diffusion-finetune-lora-task.json"
provider:
  max_concurrency_per_key: 2
  scheduler_interval_milliseconds: 100
  scheduler_batch_size: 100
  default_queue_timeout_seconds: 600
  max_attempts_per_job: 2
  key_cooldown_seconds: 3600
  stream_subscriber_buffer: 128
  shutdown_timeout_seconds: 600
  max_secret_bytes: 4096
  key_encryption:
    encryption_key_file: "config/secrets/provider_key_encryption.txt"
  services_file: "config/provider_services.json"
  wallet:
    signer_address: "0x0000000000000000000000000000000000000001"
    networks:
      base:
        display_name: "Base"
        benefit_address_contract: "0x0000000000000000000000000000000000000002"
        fixed_withdrawal_fee_cnx: "1"
        withdrawal_min_cnx: "10000"
        max_withdrawals_per_day: 3
        fee_receiver_address: "0x0000000000000000000000000000000000000003"
